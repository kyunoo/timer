<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ㄴㄴ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen m-0">

    <div class="w-full max-w-md h-full sm:h-[650px] bg-white sm:rounded-2xl shadow-lg flex flex-col overflow-hidden">
        

        <div class="bg-white border-b px-4 py-3 flex items-center justify-between">
            <div>
                <span id="room-title" class="font-bold text-gray-800 text-lg">ㄴㄴㄴㄴ</span>
                <p class="text-xs text-gray-500">ㄴㄴㄴㄴㄴㄴ</p>
            </div>
            <button onclick="changeRoom()" class="text-xs bg-gray-200 px-2.5 py-1.5 rounded-lg font-medium hover:bg-gray-300">방 바꾸기</button>
        </div>


        <div id="chat-window" class="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50">

        </div>


        <div class="p-3 bg-white border-t flex gap-2">
            <input id="message-input" type="text" placeholder="입력하세요..." 
                   class="flex-1 border rounded-full px-4 py-2 text-sm focus:outline-none focus:border-black"
                   onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-black text-white px-5 py-2 rounded-full text-sm font-semibold hover:bg-gray-800">전송</button>
        </div>
    </div>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        // 파이어베이스 설정값
        const firebaseConfig = {
            apiKey: "AIzaSyCNMYQebSxdOMrORfFfHr2eTc9EEYR0fKg",
            authDomain: "school-dm-7dd32.firebaseapp.com",
            projectId: "school-dm-7dd32",
            storageBucket: "school-dm-7dd32.firebasestorage.app",
            messagingSenderId: "752703021931",
            appId: "1:752703021931:web:5d5388ac7ed83fa84b622e",
            measurementId: "G-H72E77J337"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 사용자 닉네임 설정
        let username = prompt("사용할 닉네임(이름)을 입력해주세요:") || "익명";
        let roomId = prompt("참여할 방 이름(코드)을 입력해주세요 :") || "default_room";
        

        let unsubscribe = null;

        // 실시간 메시지 불러오기 및 렌더링 함수
        function loadMessages() {
            const chatWindow = document.getElementById('chat-window');
            const q = query(collection(db, "rooms", roomId, "messages"), orderBy("createdAt", "asc"));

            if (unsubscribe) unsubscribe();

            unsubscribe = onSnapshot(q, (snapshot) => {
                chatWindow.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isMe = data.sender === username;

                    const messageDiv = document.createElement('div');
                    messageDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;

                    messageDiv.innerHTML = `
                        <span class="text-[11px] text-gray-400 mx-1 mb-0.5">${data.sender}</span>
                        <div class="max-w-[75%] px-4 py-2 rounded-2xl text-sm ${isMe ? 'bg-black text-white rounded-br-none' : 'bg-white border text-gray-800 rounded-bl-none shadow-sm'}">
                            ${data.text}
                        </div>
                    `;
                    chatWindow.appendChild(messageDiv);
                });
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }, (error) => {
                console.error("데이터 로드 에러:", error);
            });
        }

        // 메시지 전송 함수
        window.sendMessage = async function() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (text === '') return;

            try {
                await addDoc(collection(db, "rooms", roomId, "messages"), {
                    text: text,
                    sender: username,
                    createdAt: serverTimestamp()
                });
                input.value = '';
            } catch (e) {
                console.error("전송 에러: ", e);
                alert("메시지 전송에 실패했습니다. 파이어베이스 보안 규칙(Rules)을 다시 확인해주세요.");
            }
        };

        // 방 바꾸기 기능
        window.changeRoom = function() {
            const newRoom = prompt("이동할 방 이름을 입력하세요:");
            if (newRoom) {
                roomId = newRoom;
                document.getElementById('room-title').innerText = `# ${roomId} 토론 방 (${username})`;
                loadMessages();
            }
        }

        loadMessages();
    </script>
</body>
</html>
