<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박현우가 만든 좀 쩌는거</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="박현우가 만든 좀 쩌는거">
    
    <!-- 앱 아이콘 인식을 위한 manifest 연결 추가 -->
    <link rel="manifest" href="manifest.json">

    <!-- 깃허브 Raw 이미지 주소 적용 -->
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/kyunoo/timer/main/icon.png">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/kyunoo/timer/main/icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .message-row:hover .action-buttons {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen m-0">

    <div class="w-full max-w-md h-full sm:h-[650px] bg-white sm:rounded-2xl shadow-lg flex flex-col overflow-hidden relative">
        
        <div class="bg-white border-b px-4 py-3 flex items-center justify-between">
            <div>
                <span id="room-title" class="font-bold text-gray-800 text-lg">박현우가 만든 좀 쩌는거</span>
                <p class="text-xs text-gray-500">#도훈이밴한다</p>
            </div>
            <div class="flex gap-1.5">
                <button onclick="changeName()" class="text-xs bg-gray-100 px-2 py-1.5 rounded-lg font-medium hover:bg-gray-200 text-gray-700">이름 바꾸기</button>
                <button onclick="openBanModal()" class="text-xs bg-red-50 text-red-600 px-2 py-1.5 rounded-lg font-medium hover:bg-red-100">밴 목록</button>
                <button onclick="changeRoom()" class="text-xs bg-gray-200 px-2.5 py-1.5 rounded-lg font-medium hover:bg-gray-300">방 바꾸기</button>
            </div>
        </div>

        <div id="chat-window" class="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50">
        </div>

        <div class="p-3 bg-white border-t flex flex-col gap-1">
            <div id="reply-indicator" class="text-xs text-blue-600 hidden px-2 flex justify-between items-center bg-blue-50 py-1 rounded">
                <span id="reply-text">답장 중...</span>
                <button onclick="cancelReply()" class="text-gray-500 font-bold hover:text-black">×</button>
            </div>
            <div class="flex gap-2">
                <input id="message-input" type="text" placeholder="입력하세요..." 
                       class="flex-1 border rounded-full px-4 py-2 text-sm focus:outline-none focus:border-black"
                       onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()" class="bg-black text-white px-5 py-2 rounded-full text-sm font-semibold hover:bg-gray-800">전송</button>
            </div>
        </div>

        <div id="ban-modal" class="absolute inset-0 bg-black/50 hidden flex justify-center items-center p-4">
            <div class="bg-white w-full max-w-xs rounded-xl p-4 flex flex-col max-h-[80%]">
                <div class="flex justify-between items-center mb-3 border-b pb-2">
                    <span class="font-bold text-sm text-gray-800">밴된 유저 목록</span>
                    <button onclick="closeBanModal()" class="text-gray-500 font-bold text-sm">✕</button>
                </div>
                <div id="ban-list-container" class="flex-1 overflow-y-auto space-y-2 text-sm">
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNMYQebSxdOMrORfFfHr2eTc9EEYR0fKg",
            authDomain: "school-dm-7dd32.firebaseapp.com",
            projectId: "school-dm-7dd32",
            storageBucket: "school-dm-7dd32.firebasestorage.app",
            messagingSenderId: "752703021931",
            appId: "1:752703021931:web:5d5388ac7ed83fa84b622e",
            measurementId: "G-H72E77J337"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        let username = localStorage.getItem("chat_username");
        if (!username) {
            username = prompt("니 이름을 입력해주세요:") || "익명";
            localStorage.setItem("chat_username", username);
        }

        let roomId = localStorage.getItem("chat_roomid");
        if (!roomId) {
            roomId = prompt("참여할 방 이름을 입력해주세요 :") || "default_room";
            localStorage.setItem("chat_roomid", roomId);
        }

        let bannedUsers = [];
        let isInitialLoad = true;

        async function fetchBansAndCheck() {
            const banSnapshot = await getDocs(collection(db, "rooms", roomId, "bans"));
            bannedUsers = [];
            let isBanned = false;
            banSnapshot.forEach((docSnap) => {
                const name = docSnap.data().name;
                bannedUsers.push(name);
                if (name === username) {
                    isBanned = true;
                }
            });
            if (isBanned) {
                alert("밴된 닉네임입니다.");
                localStorage.removeItem("chat_username");
                location.reload();
            }
        }

        await fetchBansAndCheck();
        document.getElementById('room-title').innerText = `# ${roomId} 방 (${username})`;

        let unsubscribe = null;
        let unsubscribeBans = null;
        let replyingTo = null;

        function watchBans() {
            if (unsubscribeBans) unsubscribeBans();
            unsubscribeBans = onSnapshot(collection(db, "rooms", roomId, "bans"), (snapshot) => {
                bannedUsers = [];
                snapshot.forEach((docSnap) => {
                    bannedUsers.push(docSnap.data().name);
                });
                loadMessages();
            });
        }

        function loadMessages() {
            const chatWindow = document.getElementById('chat-window');
            const q = query(collection(db, "rooms", roomId, "messages"), orderBy("createdAt", "asc"));

            if (unsubscribe) unsubscribe();

            unsubscribe = onSnapshot(q, (snapshot) => {
                chatWindow.innerHTML = '';
                
                let docChanges = snapshot.docChanges();
                if (!isInitialLoad) {
                    docChanges.forEach((change) => {
                        if (change.type === "added") {
                            const data = change.doc.data();
                            if (data.sender !== username && !bannedUsers.includes(data.sender)) {
                                if (Notification.permission === "granted") {
                                    new Notification(`[${roomId}] ${data.sender}`, {
                                        body: data.text,
                                        icon: "https://raw.githubusercontent.com/kyunoo/timer/main/icon.png"
                                    });
                                }
                            }
                        }
                    });
                }
                isInitialLoad = false;

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const isMe = data.sender === username;
                    const isUserBanned = bannedUsers.includes(data.sender);

                    const messageRow = document.createElement('div');
                    messageRow.className = `message-row flex flex-col ${isMe ? 'items-end' : 'items-start'} relative group`;

                    if (isUserBanned) {
                        const uniqueId = 'hidden-msg-' + Math.random().toString(36).substr(2, 9);
                        messageRow.innerHTML = `
                            <div class="flex items-center gap-1.5 mx-1 mb-0.5">
                                <span class="text-[11px] text-gray-400">${data.sender}</span>
                            </div>
                            <div onclick="document.getElementById('${uniqueId}').classList.toggle('hidden')" class="max-w-[75%] px-3 py-1.5 rounded-xl text-xs bg-gray-200 text-gray-600 cursor-pointer border border-gray-300">
                                밴되었습니다(터치하면 볼 수 있음)
                            </div>
                            <div id="${uniqueId}" class="hidden max-w-[75%] px-4 py-2 rounded-2xl text-sm bg-gray-100 border text-gray-500 mt-1">
                                ${data.text}
                            </div>
                        `;
                    } else {
                        let replyHtml = '';
                        if (data.replyTo) {
                            replyHtml = `<div class="text-[11px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded mb-1 border-l-2 border-black">
                                <b>${data.replyTo.sender}</b>에게 답장: ${data.replyTo.text}
                            </div>`;
                        }

                        messageRow.innerHTML = `
                            <div class="flex items-center gap-1.5 mx-1 mb-0.5">
                                <span class="text-[11px] text-gray-400">${data.sender}</span>
                                <div class="action-buttons opacity-0 transition-opacity duration-150 flex gap-1 text-[10px]">
                                    <button onclick="setReply('${data.sender}', '${data.text.replace(/'/g, "\\'")}')" class="bg-gray-200 px-1.5 py-0.5 rounded hover:bg-gray-300 text-gray-700">답장</button>
                                    <button onclick="banUser('${data.sender}')" class="bg-red-100 px-1.5 py-0.5 rounded hover:bg-red-200 text-red-600 font-bold">밴</button>
                                </div>
                            </div>
                            ${replyHtml}
                            <div class="max-w-[75%] px-4 py-2 rounded-2xl text-sm ${isMe ? 'bg-black text-white rounded-br-none' : 'bg-white border text-gray-800 rounded-bl-none shadow-sm'}">
                                ${data.text}
                            </div>
                        `;
                    }
                    chatWindow.appendChild(messageRow);
                });
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }, (error) => {
                console.error("데이터 로드 에러:", error);
            });
        }

        window.setReply = function(sender, text) {
            replyingTo = { sender, text };
            const indicator = document.getElementById('reply-indicator');
            const replyText = document.getElementById('reply-text');
            replyText.innerText = `[${sender}] "${text}"에 답장 중...`;
            indicator.classList.remove('hidden');
            document.getElementById('message-input').focus();
        };

        window.cancelReply = function() {
            replyingTo = null;
            document.getElementById('reply-indicator').classList.add('hidden');
        };

        window.banUser = async function(targetName) {
            const password = prompt(`관리자 비밀번호를 입력하세요:`);
            if (password !== "w3d74856") {
                if (password !== null) alert("비밀번호가 틀렸습니다.");
                return;
            }

            try {
                await addDoc(collection(db, "rooms", roomId, "bans"), {
                    name: targetName,
                    bannedAt: serverTimestamp()
                });
                alert(`'${targetName}'님이 밴되었습니다.`);
            } catch (e) {
                console.error("밴 처리 실패:", e);
                alert("밴 처리에 실패했습니다.");
            }
        };

        window.openBanModal = async function() {
            const container = document.getElementById('ban-list-container');
            container.innerHTML = '불러오는 중...';
            document.getElementById('ban-modal').classList.remove('hidden');

            const banSnapshot = await getDocs(collection(db, "rooms", roomId, "bans"));
            container.innerHTML = '';

            if (banSnapshot.empty) {
                container.innerHTML = '<p class="text-gray-400 text-center py-4">밴된 유저가 없습니다.</p>';
                return;
            }

            banSnapshot.forEach((banDoc) => {
                const data = banDoc.data();
                const banId = banDoc.id;

                const item = document.createElement('div');
                item.className = 'flex justify-between items-center bg-gray-50 p-2 rounded border';
                item.innerHTML = `
                    <span class="font-medium text-gray-800">${data.name}</span>
                    <button onclick="unbanUser('${banId}', '${data.name}')" class="bg-black text-white px-2.5 py-1 rounded text-xs font-semibold hover:bg-gray-800">초대</button>
                `;
                container.appendChild(item);
            });
        };

        window.closeBanModal = function() {
            document.getElementById('ban-modal').classList.add('hidden');
        };

        window.unbanUser = async function(banId, targetName) {
            const password = prompt("관리자 비밀번호를 입력하세요:");
            if (password !== "w3d74856") {
                if (password !== null) alert("비밀번호가 틀렸습니다!");
                return;
            }

            try {
                await deleteDoc(doc(db, "rooms", roomId, "bans", banId));
                alert(`'${targetName}'님의 밴이 해제되었습니다.`);
                openBanModal();
            } catch (e) {
                console.error("밴 해제 실패:", e);
                alert("밴 해제에 실패했습니다.");
            }
        };

        window.changeName = function() {
            const newName = prompt("변경할 닉네임을 입력하세요:");
            if (newName) {
                localStorage.setItem("chat_username", newName);
                location.reload();
            }
        };

        window.sendMessage = async function() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (text === '') return;

            if (bannedUsers.includes(username)) {
                alert("너 밴임 ㅋㅋㅋㅋ.");
                return;
            }

            try {
                const messageData = {
                    text: text,
                    sender: username,
                    createdAt: serverTimestamp()
                };

                if (replyingTo) {
                    messageData.replyTo = replyingTo;
                }

                await addDoc(collection(db, "rooms", roomId, "messages"), messageData);
                input.value = '';
                cancelReply();
            } catch (e) {
                console.error("전송 에러: ", e);
                alert("메시지 전송에 실패했습니다.");
            }
        };

        window.changeRoom = function() {
            const newRoom = prompt("이동할 방 이름을 입력하세요:");
            if (newRoom) {
                localStorage.setItem("chat_roomid", newRoom);
                location.reload();
            }
        }

        watchBans();
        loadMessages();
    </script>
</body>
</html>
